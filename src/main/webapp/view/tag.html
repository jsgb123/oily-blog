
    #include("common/header.html")
    
    <main>
        <div class="container">
            <div class="content-wrap">
                <div class="articles">
                    <h1>标签：#(currentTag)</h1>
                    #for(article : articlePage.getList())
                    <article class="article-item">
                        <h2 class="article-title">
                            <a href="#(ctx)/article/#(article.SLUG)">#(article.TITLE)</a>
                        </h2>
                        <div class="article-meta">
                            <span>📅 #date(article.CREATE_TIME, "yyyy-MM-dd")</span>
                            <span>👁 #(article.VIEW_COUNT) 次阅读</span>
                        </div>
                        <a href="#(ctx)/article/#(article.SLUG)" class="read-more">阅读全文 →</a>
                    </article>
                    #end
                </div>
                
                <aside class="sidebar">
                    #include("common/sidebar.html")
                </aside>
            </div>
        </div>
    </main>
    
    #include("common/footer.html")
