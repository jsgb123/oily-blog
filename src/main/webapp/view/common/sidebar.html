<!-- 右侧：侧边栏 -->

<div class="widget">
    <h3>📱 微信公众号</h3>
    <div class="wechat-icons">
        <a href="javascript:void(0)" onclick="showQRCode('bytecode')" class="wechat-link">
            <span>🔧</span> 会编码
        </a>
        <a href="javascript:void(0)" onclick="showQRCode('xiamixiake')" class="wechat-link">
            <span>🎮</span> 虾米虾壳
        </a>
    </div>
</div>
<div class="widget">
    <h3>🔍 搜索</h3>
    <form action="#(ctx)/" method="get" class="search-form">
        <input type="text" name="keyword" placeholder="搜索文章..." value="#(keyword ?? '')">
        <button type="submit">搜索</button>
    </form>
</div>

<div class="widget">
    <h3>📂 分类</h3>
    <ul class="category-list">
        #for(cate : categories)
        <li>
            <a href="#(ctx)/c/#(cate.SLUG)">#(cate.NAME)</a>
            <span class="count">(#(cate.ARTICLE_COUNT ?? 0))</span>
        </li>
        #end
    </ul>
</div>

<div class="widget">
    <h3>🔥 热门文章</h3>
    <ul class="hot-list">
        #for(item : hotArticles)
        <li>
            <a href="#(ctx)/article/#(item.SLUG)">#(item.TITLE)</a>
            <span class="views">(#(item.VIEW_COUNT))</span>
        </li>
        #end
    </ul>
</div>
